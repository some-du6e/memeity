[package]
name = "memeity"
version = "1.1.3"
description = "One meme folder, everywhere, with a Raycast-style search pane"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519).
name = "memeity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["ocr"]
# Reading text in images (PaddleOCR on ONNX Runtime). Turned off only for targets
# ONNX Runtime has no prebuilt binaries for (Intel Macs); see src/ocr.rs.
ocr = ["dep:oar-ocr"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Google Drive sync
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "macros", "rt", "fs"] }
# Linux: the Secret Service (GNOME Keyring, KWallet) keeps the sign-in across reboots;
# kernel keyutils alone ("linux-native") is in-memory only, so it'd sign you out each boot.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
trash = "5"
humantime = "2"
# Search index (per device, never synced): SQLite with FTS5 for text found in images.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
nucleo-matcher = "0.3"
walkdir = "2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tauri-plugin-autostart = "2"
enigo = "0.6"
# OCR: PaddleOCR (PP-OCRv6) models on ONNX Runtime. Needs Rust 1.95+.
oar-ocr = { version = "0.10", optional = true }
tauri-plugin-updater = "2"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"

# Dragging memes out of the pane into other apps (CrabNebula's drag, without its Tauri
# plugin: that would let the webview drag any file; our command checks the library).
# Not on Linux, where its GTK drag never delivers the file: see src/gtkdrag.rs.
[target.'cfg(not(target_os = "linux"))'.dependencies]
drag = "2.1.1"

# Linux: dragging memes out (src/gtkdrag.rs). Same version Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
# Instant insert: save/restore the clipboard and refocus the previous app.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  # Shortcuts Windows reserves (Alt+Space, Win+...): a low-level keyboard hook (winhook.rs).
  "Win32_System_LibraryLoader",
] }
# Turning the pane's hide animation on/off (DWM). Same `windows` version Tauri uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# macOS: re-apply the Dock icon after switching between menu-bar-only and Dock modes.
# Same versions Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSWindow", "NSView", "NSResponder", "NSColor", "objc2-quartz-core"] }
# Rounded pane corners (the content view's layer).
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# Debug info is most of a dev build's size on disk. Keep just enough of it for file:line
# in panics and backtraces.
[profile.dev]
debug = "line-tables-only"

# `tauri dev` builds are unoptimized, which makes image decoding/encoding ~50x slower
# (seconds per copy for big memes). Optimize dependencies only; our own code stays debuggable.
# No debug info for them either: nobody steps through dependency code.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
