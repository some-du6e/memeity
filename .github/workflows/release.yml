# Builds installers for Windows, macOS (Apple Silicon + Intel) and Linux when a version tag
# like v0.1.0 is pushed, and attaches them to a DRAFT GitHub Release. Review the draft,
# then publish it: only published releases are offered by the in-app updater.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   MEMEITY_GOOGLE_CLIENT_ID / MEMEITY_GOOGLE_CLIENT_SECRET   built-in Google sign-in
#   TAURI_SIGNING_PRIVATE_KEY                                  signs updates (~/.tauri/memeity-updater.key)
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD             Developer ID Application cert (.p12, base64)
#   APPLE_SIGNING_IDENTITY                                     e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_PRIVATE_KEY   notarization: App Store Connect API key ID,
#                                                              issuer ID, and the AuthKey_<ID>.p8 contents
# See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  # Type-check, lint and test first (ci.yml): a release is only built if they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  # One draft release up front, which every build uploads into. (If each build created
  # its own, parallel builds race and you get duplicate drafts.)
  create-release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `memeity ${tag}`,
              draft: true,
              prerelease: false,
              body: [
                "Download the installer for your computer below.",
                "",
                "- **Windows:** `memeity_*_x64-setup.exe`",
                "- **Windows on ARM** (e.g. Snapdragon laptops): `memeity_*_arm64-setup.exe`",
                "- **Mac (Apple Silicon):** `memeity_*_aarch64.dmg`",
                "- **Mac (Intel):** `memeity_*_x64.dmg` (no text recognition: search by name, plus text read on your other devices)",
                "- **Linux:** `memeity_*_amd64.AppImage` (Ubuntu 24.04, Fedora 39, Debian 13 or newer): make it executable, then run it",
                "",
                "The Mac builds are signed and notarized by Apple. The Windows builds aren't code-signed, so Windows may show \"Windows protected your PC\": click **More info → Run anyway**.",
              ].join("\n"),
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Windows on ARM (Snapdragon laptops etc.), built natively on an ARM runner.
          # ONNX Runtime ships prebuilt ARM64 Windows binaries, so text recognition stays in.
          - platform: windows-11-arm
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # Intel Macs: ONNX Runtime has no prebuilt binaries for them, so this build
          # leaves out text recognition (the `ocr` feature). See src-tauri/src/ocr.rs.
          - platform: macos-latest
            args: --target x86_64-apple-darwin -- --no-default-features
          # Linux AppImage. Built on 24.04: ONNX Runtime's prebuilt library (OCR) needs
          # glibc 2.38+, so it runs on distros at least that new.
          - platform: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MEMEITY_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MEMEITY_GOOGLE_CLIENT_SECRET }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          names="CLIENT_ID CLIENT_SECRET SIGNING_KEY"
          # Mac builds are signed and notarized: never ship an unsigned one by accident.
          if [ "$RUNNER_OS" = "macOS" ]; then
            names="$names APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY"
          fi
          missing=0
          for name in $names; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see RELEASING.md)"; missing=1; fi
          done
          exit $missing

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match tauri.conf.json version $version"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - run: npm ci

      # Tauri's notarization reads the App Store Connect API key from a file.
      - name: Write the notarization API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # v1+: v0 silently ignores uploadUpdaterSignatures (below).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEMEITY_GOOGLE_CLIENT_ID: ${{ secrets.MEMEITY_GOOGLE_CLIENT_ID }}
          MEMEITY_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMEITY_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: Tauri imports the certificate into a temporary keychain, signs with the
          # hardened runtime, then notarizes and staples. Unset on Windows (ignored there).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY_PATH comes from the step above.
        with:
          # Upload into the draft made by `create-release` (also merges each platform
          # into one latest.json for the updater).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The updater reads signatures from latest.json; separate .sig files would just
          # clutter the release's download list.
          uploadUpdaterSignatures: false
          # Windows ships only the setup.exe (no MSI): point updates at it.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Tauri notarizes the .app inside the DMG but not the DMG itself, which Gatekeeper
      # then rejects as "Unnotarized Developer ID". Notarize + staple it and re-upload.
      - name: Notarize the DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m \
              | tee notary.log
            grep -q "status: Accepted" notary.log
            xcrun stapler staple "$dmg"
            spctl -a -t open --context context:primary-signature -v "$dmg"
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          done
